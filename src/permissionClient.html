<script>
(function(global) {
  'use strict';

  var state = { started: false, bound: false, user: null };
  var storageKey = 'yasuragi_permission_' + String(global.AUTH_APP_TYPE || document.title || 'app')
    .toLowerCase().replace(/[^a-z0-9_-]+/g, '_');

  function loginEnabled() {
    return typeof LOGIN_ENABLED !== 'undefined' && LOGIN_ENABLED === true;
  }

  function readSavedAuth() {
    var raw = '';
    try { localStorage.removeItem(storageKey); } catch (error) {}
    try { raw = sessionStorage.getItem(storageKey) || ''; } catch (error) {}
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (error) { return null; }
  }

  function saveAuth(auth) {
    clearSavedAuth();
    auth.remember = false;
    try {
      sessionStorage.setItem(storageKey, JSON.stringify(auth));
    } catch (error) {}
  }

  function clearSavedAuth() {
    try { localStorage.removeItem(storageKey); } catch (error) {}
    try { sessionStorage.removeItem(storageKey); } catch (error) {}
  }

  function setLoginMessage(message, isError) {
    var area = document.getElementById('loginMessage');
    if (!area) return;
    area.textContent = String(message || '');
    area.classList.toggle('error', !!isError);
  }

  function clearLoginInputs() {
    var id = document.getElementById('loginIdInput');
    var password = document.getElementById('loginCodeInput');
    if (id) id.value = '';
    if (password) password.value = '';
  }

  function finishSplash() {
    if (typeof global.hideBootOverlay === 'function') global.hideBootOverlay();
  }

  function showLogin(message) {
    var screen = document.getElementById('loginScreen');
    if (screen) screen.classList.remove('hidden');
    var button = document.getElementById('loginButton');
    if (button) button.disabled = false;
    setLoginMessage(message || '', !!message);
    finishSplash();
  }

  function hideLogin() {
    var screen = document.getElementById('loginScreen');
    if (screen) screen.classList.add('hidden');
    setLoginMessage('', false);
  }

  function restartSplash() {
    if (!loginEnabled()) return;
    if (typeof global.showBootOverlay === 'function') { global.showBootOverlay(); return; }
    var overlay = document.getElementById('bootOverlay');
    if (!overlay) return;
    global.ygSplashHidden = false; global.ygSplashOrbitCompleted = false; global.ygSplashHideRequested = false;
    overlay.classList.remove('hidden', 'yg-splash-out'); overlay.setAttribute('aria-hidden', 'false');
    if (typeof global.startYgSplash === 'function') global.startYgSplash();
  }

  function startApp(startCallback, user) {
    if (state.started) return;
    state.started = true;
    state.user = user || null;
    global.currentAuthUser = state.user;
    hideLogin();
    ensureLogoutButton(state.user);
    restartSplash();
    startCallback();
  }

  function ensureLogoutButton(user) {
    if (!loginEnabled()) return;
    var button = document.getElementById('permissionLogoutButton');
    var userLabel = document.getElementById('permissionUserLabel');
    if (!button) return;
    if (!button.dataset.permissionLogoutBound) {
      button.dataset.permissionLogoutBound = '1';
      button.addEventListener('click', function() {
        var auth = readSavedAuth();
        clearSavedAuth();
        state.started = false;
        state.user = null;
        global.currentAuthUser = null;
        if (userLabel) userLabel.textContent = '';
        button.hidden = true;
        clearLoginInputs();
        showLogin('ログアウトしました。');
        if (!auth || !auth.token) return;
        google.script.run
          .withSuccessHandler(function() {})
          .withFailureHandler(function() {})
          .permissionLogout(auth.token);
      });
    }
    button.hidden = false;
    if (userLabel) userLabel.textContent = user && user.name ? user.name : '';
    button.textContent = 'ログアウト';
  }

  function verifySavedAuth(startCallback, auth) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.valid) {
          clearSavedAuth();
          showLogin();
          return;
        }
        auth.user = result.user || auth.user || null;
        saveAuth(auth);
        startApp(startCallback, auth.user);
      })
      .withFailureHandler(function(error) {
        clearSavedAuth();
        showLogin(error && error.message ? error.message : 'ログイン状態を確認できませんでした。');
      })
      .permissionVerifySession(auth.token);
  }

  function executeLogin(startCallback) {
    var id = document.getElementById('loginIdInput');
    var password = document.getElementById('loginCodeInput');
    var button = document.getElementById('loginButton');
    var loginId = id ? id.value.trim() : '';
    var code = password ? password.value : '';
    if (!loginId || !code) {
      setLoginMessage('職員IDとパスワードを入力してください。', true);
      return;
    }
    if (button) button.disabled = true;
    setLoginMessage('', false);
    google.script.run
      .withSuccessHandler(function(result) {
        if (button) button.disabled = false;
        var auth = {
          token: result.token,
          user: result.user || null,
          remember: false,
          expiresAt: result.expiresAt || 0
        };
        saveAuth(auth);
        startApp(startCallback, auth.user);
      })
      .withFailureHandler(function(error) {
        if (button) button.disabled = false;
        setLoginMessage(error && error.message ? error.message : 'ログインに失敗しました。', true);
        finishSplash();
      })
      .permissionLogin(loginId, code, null);
  }

  function bindLogin(startCallback) {
    if (state.bound) return;
    state.bound = true;
    var button = document.getElementById('loginButton');
    var id = document.getElementById('loginIdInput');
    var password = document.getElementById('loginCodeInput');
    if (button) button.addEventListener('click', function() { executeLogin(startCallback); });
    [id, password].forEach(function(input) {
      if (input) input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') executeLogin(startCallback);
      });
    });
  }

  global.startPermissionProtectedApp = function(startCallback) {
    bindLogin(startCallback);
    if (!loginEnabled()) {
      clearSavedAuth();
      startApp(startCallback, null);
      return;
    }
    var auth = readSavedAuth();
    if (!auth || !auth.token || (auth.expiresAt && auth.expiresAt <= Date.now())) {
      clearSavedAuth();
      showLogin();
      return;
    }
    verifySavedAuth(startCallback, auth);
  };

  global.getAuthTokenOrThrow = function() {
    if (!loginEnabled()) return '';
    var auth = readSavedAuth();
    if (!auth || !auth.token || (auth.expiresAt && auth.expiresAt <= Date.now())) {
      clearSavedAuth();
      showLogin('ログインの有効期限が切れました。再度ログインしてください。');
      throw new Error('ログインの有効期限が切れました。再度ログインしてください。');
    }
    return auth.token;
  };

  global.handleAuthFailure = function(error) {
    var message = error && error.message ? error.message : 'ログインの有効期限が切れました。再度ログインしてください。';
    if (!loginEnabled() || !/ログイン|権限|利用できません/.test(message)) return false;
    clearSavedAuth();
    showLogin(message);
    return true;
  };
})(window);
</script>
